<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AttnWall</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><img class="mark" src="icons/attnwall-48.png" width="32" height="32" alt=""><strong>AttnWall</strong><label class="sr-only" for="language-select">界面语言</label><select id="language-select" data-language-select aria-label="界面语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select><small id="extension-version"></small></header>
<main>
  <section class="status" aria-live="polite"><span id="dot" class="dot" aria-hidden="true"></span><div><strong id="status-title">检查连接…</strong><p id="status-detail"></p></div></section>
  <section class="status tab-status"><span id="tab-dot" class="dot" aria-hidden="true"></span><div><strong id="tab-title">检查当前页…</strong><p id="tab-detail"></p></div></section>
  <details id="connection-settings"><summary>连接配置</summary><label class="sr-only" for="connection">AttnWall 连接配置</label><textarea id="connection" placeholder="粘贴连接配置" rows="3" spellcheck="false"></textarea><div class="actions"><button class="primary" id="connect" disabled>连接</button></div></details>
  <p id="feedback" role="status"></p>
  <nav class="site-links" aria-label="AI 应用"><a href="https://chatgpt.com/" target="_blank" rel="noreferrer">ChatGPT ↗</a><a href="https://chatgpt.com/codex" target="_blank" rel="noreferrer">Codex Web ↗</a><a href="https://chat.deepseek.com/" target="_blank" rel="noreferrer">DeepSeek ↗</a></nav>
</main>
<footer><button id="dashboard">打开 AttnWall ↗</button><button id="disconnect" disabled>断开</button></footer>
<script src="i18n.js"></script><script src="popup.js"></script>
</body></html>
