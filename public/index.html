<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f7"><meta name="description" content="AttnWall 会话与收件箱">
  <link rel="manifest" href="/manifest.webmanifest?v=coral-1"><link rel="icon" href="/icons/attnwall-coral-v1.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/attnwall-coral-v1-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/attnwall-coral-v1-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/attnwall-coral-v1-152.png">
  <meta name="apple-mobile-web-app-title" content="AttnWall">
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/workspace.css"><title>AttnWall</title>
</head>
<body>
  <section id="login" class="login-page hidden">
    <div class="login-panel">
      <div class="brand-symbol large"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 7v6c0 4-8 8-8 8s-8-4-8-8V7z M8 12l3 3 5-6"/></svg></div><h1>AttnWall</h1>
      <form id="login-form"><label for="login-language-select">界面语言</label><select id="login-language-select" data-language-select aria-label="界面语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select><label for="access-token">访问密钥</label><input id="access-token" type="password" placeholder="终端中的 Access key" autocomplete="current-password" required><button class="primary full" type="submit">登录</button></form>
      <p id="login-error" class="error" role="alert"></p>
    </div>
  </section>
  <div id="application" class="application hidden">
    <header class="topbar">
      <div class="brand"><div class="brand-symbol"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 7v6c0 4-8 8-8 8s-8-4-8-8V7z M8 12l3 3 5-6"/></svg></div><span>AttnWall</span></div>
      <div class="top-actions"><span class="top-status hidden" id="connection-label" role="status"></span><button class="icon-button" id="notify-button" title="启用通知" aria-label="启用通知" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9 M10 21h4"/></svg></button><button class="icon-button" id="settings-button" title="设置" aria-label="设置"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></svg></button></div>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="会话导航">
        <button id="inbox-nav" class="navigation active"><span class="nav-icon"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z M4 14h5l2 3h2l2-3h5"/></svg></span><span>收件箱</span><span class="counter" id="unread-count">0</span></button>
        <div class="section-heading sessions-heading"><span>会话 <span id="session-filter-summary" class="session-filter-summary" aria-live="polite"></span></span><button id="attach-button" class="small-action" title="添加会话" aria-label="添加会话">＋</button></div>
        <label class="session-range-control"><select id="session-range" aria-label="会话活动时间"><option value="1d">最近 24 小时</option><option value="7d" selected>最近一周</option><option value="30d">最近一个月</option><option value="all">全部会话</option></select></label>
        <input id="session-search" class="session-search" type="search" autocomplete="off" placeholder="搜索会话" aria-label="搜索会话">
        <div id="session-list" class="session-list"></div>
      </aside>
      <main class="content">
        <section id="inbox-view">
          <div class="page-title"><h1>收件箱 <small id="inbox-window" class="muted"></small></h1><button class="text-button hidden" id="mark-all">全部已读</button></div>
          <div id="delivery-status" class="delivery-status hidden" role="status"><span>待投递 <strong id="stat-queue">0</strong></span><span id="delivery-text"></span></div>
          <div id="inbox-items" class="inbox-items"></div>
        </section>
        <section id="conversation-view" class="hidden">
          <div class="conversation-header"><button id="back-button" aria-label="返回收件箱" class="icon-button mobile-back">←</button><div class="conversation-title"><div class="conversation-source" id="conversation-runtime"></div><h1 id="conversation-name" data-i18n-skip>会话</h1><p id="conversation-path" class="muted" data-i18n-skip></p></div><div class="conversation-tools"><button class="text-button" id="mark-session-read">标为已读</button></div></div>
          <div class="history-toolbar"><span id="history-status" class="muted" role="status"></span><button type="button" id="history-retry" class="text-button hidden">重试</button><button type="button" id="history-older" class="text-button hidden">更早消息</button></div>
          <div id="conversation-messages" class="conversation-messages"></div>
          <form id="compose" class="compose"><textarea id="compose-text" aria-label="回复消息" rows="2" maxlength="10000" placeholder="回复…"></textarea><div id="compose-attachment-preview" class="compose-attachment-preview hidden"></div><div class="compose-actions"><label id="compose-image-label" class="compose-image-label" for="compose-image"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9 M6 14l8-8"/></svg> 图片<input id="compose-image" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><button id="instant-toggle" class="compose-instant" type="button" aria-pressed="false" aria-label="开启快速模式" title="任务完成后立即通知">快速模式：关</button><button type="submit" class="primary">发送 ↑</button></div></form>
        </section>
        <section id="settings-view" class="hidden">
          <div class="page-title"><h1>设置</h1></div>
          <form id="settings-form" class="settings-form">
            <div class="setting-card">
              <div class="field-row"><label for="language-select">界面语言</label><select id="language-select" data-language-select aria-label="界面语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select></div>
              <div class="field-row"><label for="interval">提醒间隔（分钟）</label><input id="interval" type="number" min="1" max="1440" value="20" required></div>
              <label class="switch-row"><span>允许即时通知</span><input id="instant-enabled" type="checkbox"></label>
              <label class="switch-row"><span>免打扰</span><input id="dnd-enabled" type="checkbox" aria-controls="dnd-schedule"></label>
              <div id="dnd-schedule"><div class="time-fields"><div><label for="dnd-start">开始</label><input id="dnd-start" type="time" required></div><div><label for="dnd-end">结束</label><input id="dnd-end" type="time" required></div></div><div class="field-row"><label for="time-zone">时区</label><input id="time-zone" type="text" required></div></div>
            </div>
            <div class="settings-actions"><button type="submit" class="primary">保存</button><span id="settings-feedback" class="muted" role="status"></span></div>
          </form>
          <details class="setting-card push-diagnostics"><summary>通知设备</summary><div id="push-device-list" class="push-device-list"></div><p id="push-test-feedback" class="muted" role="status"></p></details>
          <details class="setting-card browser-onboarding"><summary>连接网页会话</summary>
            <div class="onboarding-step"><span>1</span><div><strong>安装扩展</strong><p>浏览器扩展 → 开发者模式 → 加载已解压的扩展程序，选择 <code>extensions/browser</code>。</p></div></div>
            <div class="onboarding-step"><span>2</span><div><button class="outline" type="button" id="copy-browser-config">复制连接配置</button><p>粘贴到 AttnWall Web Bridge。</p><p id="browser-config-feedback" class="browser-feedback" role="status"></p></div></div>
            <div class="onboarding-step"><span>3</span><div><strong>打开会话</strong><p><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT ↗</a> · <a href="https://chatgpt.com/codex" target="_blank" rel="noopener noreferrer">Codex Web ↗</a> · <a href="https://chat.deepseek.com/" target="_blank" rel="noopener noreferrer">DeepSeek ↗</a></p><p>会话标签页需保持打开。</p></div></div>
          </details>
          <div class="settings-logout"><button class="text-button" id="logout">退出登录</button></div>
        </section>
      </main>
    </div>
    <nav class="mobile-nav" aria-label="主导航"><button data-nav="inbox" class="active"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z M4 14h5l2 3h2l2-3h5"/></svg><span>收件箱</span></button><button data-nav="sessions"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z"/></svg><span>会话</span></button><button data-nav="settings"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></svg><span>设置</span></button></nav>
    <div id="toast" role="status" class="toast hidden"></div>
  </div>
  <dialog id="add-source-dialog" aria-labelledby="add-source-title"><h2 id="add-source-title">添加会话</h2><div class="source-choices">
    <button type="button" class="source-choice" data-add-source="codex"><span class="source-choice-symbol"><img class="runtime-logo" src="/icons/codex.svg" alt="" width="22" height="22"></span><span><strong>Codex</strong><small>新建会话</small></span><span aria-hidden="true">›</span></button>
    <button type="button" class="source-choice" data-add-source="dsh"><span class="source-choice-symbol"><img class="runtime-logo" src="/icons/deepseek.svg" alt="" width="22" height="22"></span><span><strong>DeepSeek DSH</strong><small>创建或连接 Session ID</small></span><span aria-hidden="true">›</span></button>
    <button type="button" class="source-choice" data-add-source="web"><span class="source-choice-symbol"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z"/></svg></span><span><strong>网页会话</strong><small>ChatGPT / Codex / DeepSeek</small></span><span aria-hidden="true">›</span></button>
  </div><div class="dialog-buttons"><button class="outline" type="button" id="add-source-cancel">取消</button></div></dialog>
  <dialog id="codex-create-dialog" aria-labelledby="codex-create-title"><form id="codex-create-form"><h2 id="codex-create-title">新建 Codex 会话</h2><label for="codex-create-name">名称</label><input id="codex-create-name" value="新会话" data-i18n-value="新会话" maxlength="160" required><label for="codex-create-host">Connector 主机</label><input id="codex-create-host" value="local" maxlength="60" pattern="[a-zA-Z0-9._-]{1,60}" required><label for="codex-create-cwd">工作目录（可选）</label><input id="codex-create-cwd" maxlength="2048"><p id="codex-create-status" class="muted" role="status"></p><div class="dialog-buttons"><button id="codex-create-cancel" class="outline" type="button">取消</button><button class="primary" type="submit">创建</button></div></form></dialog>
  <dialog id="attach-dialog" aria-labelledby="attach-title"><form id="attach-form"><h2 id="attach-title">DeepSeek DSH</h2><label for="new-dsh-host">Connector 主机</label><input id="new-dsh-host" value="local" required maxlength="60"><label for="new-dsh-id">Session ID（留空新建）</label><input id="new-dsh-id" maxlength="250"><label for="new-dsh-title">名称</label><input id="new-dsh-title" placeholder="DSH 会话" maxlength="160"><div class="dialog-buttons"><button id="attach-cancel" class="outline" type="button">取消</button><button class="primary" type="submit">连接</button></div></form></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
